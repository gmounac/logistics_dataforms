<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gate in · Container Yard</title>
  <link rel="stylesheet" href="/static/yard.css" />
  <script src="/static/yard.js"></script>
</head>
<body>
<main>
  <header>
    <img class="logo" src="/static/mobile-logo.png" alt="Container Yard" />
    <h1>Gate in</h1>
    <nav><a href="/">Yard</a> <a href="/gate-out">Gate out</a></nav>
  </header>

  <div id="alert" class="alert" role="alert"></div>

  <section id="receipt" class="receipt" aria-live="polite">
    <div class="num" id="rNumber"></div>
    <dl>
      <dt>Recorded</dt><dd id="rAt"></dd>
      <dt>Status</dt><dd id="rStatus"></dd>
      <dt>Registry</dt><dd id="rNew"></dd>
    </dl>
  </section>

  <form id="form" novalidate>
    <fieldset>
      <legend>When</legend>
      <div class="row">
        <div class="field">
          <label for="date" class="req">Date</label>
          <input type="date" id="date" required />
          <div class="err" id="dateErr"></div>
        </div>
        <div class="field">
          <label for="time" class="req">Time in</label>
          <input type="time" id="time" required />
          <div class="err" id="timeErr"></div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Container</legend>
      <div class="field">
        <label for="containerNumber" class="req">Container number</label>
        <input id="containerNumber" maxlength="11" autocomplete="off" autocapitalize="characters"
               spellcheck="false" placeholder="MSKU6856622" required />
        <div class="hint">4 letters then 7 digits</div>
        <div class="err" id="containerNumberErr"></div>
      </div>

      <div id="knownBox" class="known">
        <div class="line">
          <span class="num"></span><span class="meta"></span><span class="visits"></span>
        </div>
        <button type="button" class="link" id="knownChange">Change details</button>
      </div>

      <div id="containerDetails">
        <div class="field">
          <label for="shippingLine" class="req">Shipping line</label>
          <select id="shippingLine" required></select>
          <div class="err" id="shippingLineErr"></div>
        </div>
        <div class="row">
          <div class="field">
            <label for="kind" class="req">Type</label>
            <select id="kind" required></select>
            <div class="err" id="kindErr"></div>
          </div>
          <div class="field">
            <label for="size" class="req">Size</label>
            <select id="size" required></select>
            <div class="err" id="sizeErr"></div>
          </div>
        </div>
        <div class="field">
          <label for="unitManufacturer" class="req">Unit manufacturer</label>
          <select id="unitManufacturer" required></select>
          <div class="err" id="unitManufacturerErr"></div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Condition on arrival</legend>
      <div class="row">
        <div class="field">
          <label for="cargoStatus" class="req">Cargo</label>
          <select id="cargoStatus" required></select>
          <div class="err" id="cargoStatusErr"></div>
        </div>
        <div class="field">
          <label for="ptiStatus" class="req">PTI status</label>
          <select id="ptiStatus" required></select>
          <div class="err" id="ptiStatusErr"></div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Hauler</legend>
      <div class="row">
        <div class="field">
          <label for="hauler" class="req">Company</label>
          <select id="hauler" required></select>
          <div class="err" id="haulerErr"></div>
        </div>
        <div class="field">
          <label for="plate">License plate</label>
          <input id="plate" placeholder="S34872" autocapitalize="characters" autocomplete="off" />
          <div class="err" id="plateErr"></div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Notes</legend>
      <div class="field">
        <label for="comments" id="commentsLabel">Comments</label>
        <textarea id="comments" placeholder="Damage, seals, anything the next shift should know"></textarea>
        <div class="err" id="commentsErr"></div>
      </div>
    </fieldset>

    <button type="submit" id="submit" class="primary">Record gate in</button>
  </form>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const NA = "Not applicable";
  const REEFER_KINDS = ["Standard", "Magnum", "Magnum +", "S Freezer"];
  let OPTIONS = null;

  // ---------------------------------------------------------------- helpers
  function fill(select, values, placeholder, keep = true) {
    const prev = keep ? select.value : "";
    select.innerHTML = "";
    const p = new Option(placeholder, "", true, true);
    p.disabled = true;
    select.add(p);
    values.forEach((v) => select.add(new Option(v, v)));
    select.value = values.includes(prev) ? prev : "";
  }

  function setError(id, msg) {
    const el = $(id + "Err");
    const field = $(id);
    el.textContent = msg || "";
    el.classList.toggle("show", !!msg);
    field.setAttribute("aria-invalid", msg ? "true" : "false");
  }

  function clearErrors() {
    document.querySelectorAll(".err").forEach((e) => e.classList.remove("show"));
    document.querySelectorAll("[aria-invalid]").forEach((e) => e.removeAttribute("aria-invalid"));
  }

  function alertBox(kind, msg) {
    const a = $("alert");
    a.className = "alert show " + kind;
    a.textContent = msg;
    a.scrollIntoView({ block: "nearest" });
  }

  function daysAgo(dateStr) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const d = new Date(dateStr + "T00:00");
    return Math.floor((today - d) / 86400000);
  }

  // --------------------------------------------------------- business rules
  // Mirrors the server-side rules in schemas.py for a better UX. The server
  // still validates everything, so these are a convenience, not a guarantee.
  function applyRules() {
    const kind = $("kind").value;
    const isDry = kind === "Dry";
    const isReefer = REEFER_KINDS.includes(kind);
    const cargo = $("cargoStatus").value;

    // Cargo: dry can't be Partial
    fill($("cargoStatus"), OPTIONS.cargo_statuses.filter((s) => !(isDry && s === "Partial")), "Select");

    // Manufacturer
    const mfr = $("unitManufacturer");
    let mfrs = OPTIONS.unit_manufacturers;
    if (kind === "S Freezer") mfrs = mfrs.filter((m) => ["Thermoking", "StarCool"].includes(m));
    if (kind === "Magnum" || kind === "Magnum +") mfrs = ["Thermoking"];
    fill(mfr, isDry ? [NA] : mfrs, "Select");
    mfr.disabled = isDry || mfrs.length === 1;
    if (mfr.disabled) mfr.value = isDry ? NA : mfrs[0];

    // PTI
    const pti = $("ptiStatus");
    let ptis = OPTIONS.pti_statuses.filter((p) => p !== "NA");
    if (cargo === "Partial" || cargo === "Full") ptis = ptis.filter((p) => p !== "NON PTI");
    fill(pti, isDry ? [NA] : ptis, "Select");
    pti.disabled = isDry;
    if (isDry) pti.value = NA;

    // Comments required for backdated entries
    const old = $("date").value && daysAgo($("date").value) > 3;
    $("commentsLabel").classList.toggle("req", old);
    $("comments").required = old;
    if (old) Yard.openNotes();
  }

  // --------------------------------------------- known-container fast path
  // When the number matches a container already on file, its registry
  // details collapse to one line so the operator only confirms the number.
  function showKnown(st) {
    const c = st.container, box = $("knownBox");
    box.querySelector(".num").textContent = c.number;
    box.querySelector(".meta").textContent =
      [c.shipping_line, Yard.typeLabel(c), c.unit_manufacturer].filter(Boolean).join(" · ");
    box.querySelector(".visits").textContent = `visit ${(st.visit_count || 0) + 1}`;
    box.classList.add("show");
    $("containerDetails").hidden = true;
  }
  function hideKnown() {
    $("knownBox").classList.remove("show");
    $("containerDetails").hidden = false;
  }
  $("knownChange").addEventListener("click", hideKnown);

  // ------------------------------------------------------------- validation
  function validate() {
    clearErrors();
    let ok = true;
    const need = (id, msg) => { if (!$(id).value.trim()) { setError(id, msg); ok = false; } };

    // if a collapsed detail is somehow blank, reopen so the error is visible
    if ($("containerDetails").hidden &&
        ["shippingLine", "kind", "size"].some((id) => !$(id).value.trim())) hideKnown();

    need("date", "Date is required");
    need("time", "Time is required");
    need("containerNumber", "Container number is required");
    need("shippingLine", "Choose a shipping line");
    need("kind", "Choose a type");
    need("size", "Choose a size");
    need("cargoStatus", "Choose a cargo status");
    need("hauler", "Choose a hauler");
    if (!$("unitManufacturer").disabled) need("unitManufacturer", "Choose a manufacturer");
    if (!$("ptiStatus").disabled) need("ptiStatus", "Choose a PTI status");

    const num = $("containerNumber").value.trim().toUpperCase();
    if (num && !/^[A-Z]{4}\d{7}$/.test(num)) { setError("containerNumber", "4 letters then 7 digits"); ok = false; }

    const plate = $("plate").value.trim().toUpperCase();
    if (plate && !/^S\d+$/.test(plate)) { setError("plate", "S followed by digits, no spaces"); ok = false; }

    if ($("comments").required && !$("comments").value.trim()) {
      setError("comments", "Comments are required for entries older than 3 days"); ok = false;
    }
    return ok;
  }

  function payload() {
    const kind = $("kind").value;
    const isDry = kind === "Dry";
    const at = new Date($("date").value + "T" + $("time").value); // local wall time
    return {
      at: at.toISOString(),
      comments: $("comments").value.trim(),
      hauler: $("hauler").value,
      hauler_plate: $("plate").value.trim().toUpperCase() || null,
      cargo_status: $("cargoStatus").value,
      pti_status: isDry ? null : $("ptiStatus").value,
      container: {
        number: $("containerNumber").value.trim().toUpperCase(),
        shipping_line: $("shippingLine").value,
        container_type: isDry ? "Dry" : "Reefer",
        size: $("size").value,
        reefer_type: isDry ? null : kind,
        unit_manufacturer: isDry ? null : $("unitManufacturer").value,
      },
    };
  }

  // ------------------------------------------------------------------ submit
  async function submit(ev) {
    ev.preventDefault();
    if (!validate()) return;
    const btn = $("submit");
    btn.disabled = true;
    $("alert").classList.remove("show");

    try {
      const body = payload();
      const known = await fetch(`/api/containers/${body.container.number}`).then((r) => r.ok);
      const res = await fetch("/api/events/gate-in", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();

      if (!res.ok) {
        const msg = Array.isArray(data.detail)
          ? data.detail.map((d) => d.msg.replace(/^Value error, /, "")).join(" ")
          : data.detail;
        alertBox("bad", msg || "Could not record gate in.");
        return;
      }

      $("rNumber").textContent = data.container.number;
      $("rAt").textContent = new Date(data.last_event.at).toLocaleString();
      $("rStatus").textContent = [data.cargo_status, data.pti_status].filter(Boolean).join(", ");
      $("rNew").textContent = known ? "Already on file" : "New container registered";
      $("receipt").classList.add("show");
      $("receipt").scrollIntoView({ block: "start", behavior: "smooth" });

      // keep date/time; clear the rest
      const d = $("date").value, t = $("time").value;
      $("form").reset();
      $("date").value = d; $("time").value = t;
      $("size").value = "FEU";
      hideKnown();
      applyRules();
      $("containerNumber").focus();
    } catch (e) {
      alertBox("bad", "Network error. Check the connection and try again.");
      console.error(e);
    } finally {
      btn.disabled = false;
    }
  }

  // -------------------------------------------------------------------- init
  async function init() {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    const today = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    $("date").value = today;
    $("date").max = today;
    $("time").value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;

    try {
      OPTIONS = await fetch("/api/options").then((r) => r.json());
    } catch {
      alertBox("bad", "Could not load form options. Is the server running?");
      return;
    }

    fill($("shippingLine"), OPTIONS.shipping_lines, "Select", false);
    fill($("kind"), ["Dry", ...OPTIONS.reefer_types], "Select", false);
    fill($("size"), OPTIONS.sizes, "Select", false);
    $("size").value = "FEU";
    fill($("hauler"), OPTIONS.haulers, "Select", false);
    applyRules();

    ["kind", "cargoStatus", "date"].forEach((id) => $(id).addEventListener("change", applyRules));

    // editing the number invalidates any collapsed "known" summary
    $("containerNumber").addEventListener("input", hideKnown);

    // Warn early if this box is already in the yard; the server rejects it anyway.
    $("containerNumber").addEventListener("blur", async () => {
      const num = $("containerNumber").value.trim().toUpperCase();
      hideKnown();
      if (!/^[A-Z]{4}\d{7}$/.test(num)) return;
      try {
        const r = await fetch(`/api/containers/${num}/state`);
        if (!r.ok) return;
        const st = await r.json();
        if (st.on_site) setError("containerNumber", `${num} is already in the yard (arrived ${new Date(st.arrived_at).toLocaleString()}). Gate it out first.`);
        else {
          // prefill what we know so the operator only confirms
          const c = st.container;
          $("shippingLine").value = c.shipping_line;
          $("kind").value = c.container_type === "Dry" ? "Dry" : c.reefer_type;
          $("size").value = c.size;
          applyRules();
          if (c.unit_manufacturer) $("unitManufacturer").value = c.unit_manufacturer;
          showKnown(st);
        }
      } catch { /* offline: server will decide */ }
    });
    $("form").addEventListener("submit", submit);
  }

  document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
